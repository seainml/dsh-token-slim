name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install (peer deps live inside a DSH deployment, so skip them here)
        run: npm install --omit=peer --ignore-scripts --no-audit --no-fund
      - name: Run unit tests
        run: npm test
